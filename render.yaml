services:
  - type: web
    name: chang-gung-rehab-checklist-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ADMIN_USERNAME
        value: testadmin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cgmh-rehab-test-db
          property: connectionString

databases:
  - name: cgmh-rehab-test-db
    databaseName: cgmh_rehab_test
    user: cgmh_rehab_app
    plan: free
    region: singapore
